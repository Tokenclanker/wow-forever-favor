name: Refresh vendor prices

# Weekly and on demand: compares every tracked item's vendor sell price with Blizzard's current WoW Forever
# item data, saves the corrections to data/vendor-fix.json and patches them into data/recipes.json (used by
# the leveling planner and Money making). Commits only those two files. Given item ids, it only checks
# those and saves nothing.
on:
  schedule:
    - cron: "53 11 * * 1"   # Mondays 5:53 AM Central
  workflow_dispatch:
    inputs:
      ids:
        description: "Only check these item ids (comma or space separated). Empty = all items, and save"
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare vendor prices
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          IDS: ${{ inputs.ids || 'all' }}
          WRITE: "1"
        run: node tools/check-vendor.mjs
      - name: Patch recipes.json
        if: ${{ inputs.ids == '' || inputs.ids == null }}
        run: node tools/apply-vendor-fix.mjs
      - name: Commit changes
        if: ${{ inputs.ids == '' || inputs.ids == null }}
        run: |
          git add data/vendor-fix.json data/recipes.json
          git diff --cached --quiet && { echo "No vendor price changes."; exit 0; }
          git config user.name "vendor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Refresh vendor prices"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
