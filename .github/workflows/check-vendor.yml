name: Check vendor prices

# Manual only: compares data/recipes.json vendor sell prices with Blizzard's current item data for the
# Vendor flips candidates (and any extra item ids given).
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Extra item ids to check (comma or space separated)"
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare vendor prices
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          IDS: ${{ inputs.ids }}
        run: node tools/check-vendor.mjs
