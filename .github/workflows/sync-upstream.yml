name: Sync with original site

# Daily: merges AidVir/wow-forever-favor's code changes into this fork, keeping this fork's NA PvE
# prices, auction houses and wording (see tools/sync-upstream.sh). A red run means a change it
# couldn't merge on its own; the fork is left as it was (or, for workflow files, everything else synced).
on:
  schedule:
    - cron: "41 10 * * *"   # 4:41 AM Central
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge upstream
        run: |
          git config user.name "sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash tools/sync-upstream.sh
