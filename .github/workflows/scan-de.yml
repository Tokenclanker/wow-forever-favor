name: Disenchant scan

# Hourly: scans the three NA auction houses for green / blue / purple armor and weapons priced near or
# below what they disenchant into, for the Disenchanting page (disenchant.html). Commits only
# data/de-listings.json and data/de-items.json. Fork-only, so the upstream sync never touches it.
on:
  schedule:
    - cron: "47 * * * *"   # after Blizzard's hourly snapshot and the price job's commit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-de
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REGION: us
        run: node tools/scan-de.mjs
      - name: Commit
        run: |
          git add data/de-listings.json data/de-items.json
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git config user.name "de-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update disenchant listings"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
