name: Probe auction houses

# Manual only: lists every auction house with the cheapest price and total units of a few commodities,
# so you can match your in-game AH to a house id for data/houses.json.
on:
  workflow_dispatch:
    inputs:
      ruleset:
        description: "Ruleset id in the API path (1 PvP, 2 Normal, 3 RP, 15 RP-PvP)"
        default: "1"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe US houses
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REGION: us
          RULESET: ${{ inputs.ruleset }}
        run: node tools/probe-houses.mjs
